# ==============================================================================
# Simulation Environment & Physics Configuration
# Calibrated against /home/ai/jamshi/vision_rl/env final.png
# ==============================================================================

physics:
  timestep: 0.002
  solver: "Newton"
  iterations: 50
  gravity: [0.0, 0.0, -9.81]

table:
  color_top: [0.08, 0.22, 0.12, 1.0] # Deep dark green cutting mat
  color_legs: [0.08, 0.08, 0.08, 1.0] # Matte black legs
  dimensions:
    length: 5.00                 # Oversized so tabletop fills 100% of camera FOV
    width: 5.00
    top_thickness: 0.03
    height_surface: 0.40         # Surface elevation from floor (medium height)
  friction: [1.0, 0.005, 0.0001]
  urdf_file: "models/urdf/table.urdf"

yellow_cube:
  size: [0.05, 0.05, 0.05]       # Exact 5cm cube
  color: [0.96, 0.85, 0.05, 1.0] # Bright yellow
  mass: 0.065                    # 65 grams (standard 5cm PLA / wood cube)
  friction: [1.4, 0.01, 0.0005]  # High static friction against rubberized gripper
  solref: [0.004, 1.0]
  solimp: [0.95, 0.99, 0.001]
  urdf_file: "models/urdf/cube.urdf"
  initial_position: [0.16, -0.01, 0.425]

cardboard_box:
  dimensions:
    height: 0.08                 # 8cm height
    length: 0.20                 # 20cm length
    width: 0.15                  # 15cm width
  color: [0.74, 0.54, 0.35, 1.0] # Kraft cardboard brown
  mass_total: 0.080              # 80 grams
  friction: [0.8, 0.005, 0.0001]
  urdf_file: "models/urdf/box.urdf"
  initial_position: [0.22, 0.25, 0.40]

lighting:
  ambient: [0.35, 0.35, 0.35]
  ceiling_key_light:
    pos: [0.30, 0.10, 1.60]
    dir: [-0.08, -0.05, -1.0]
    diffuse: [0.85, 0.85, 0.82]
    specular: [0.15, 0.15, 0.15]
