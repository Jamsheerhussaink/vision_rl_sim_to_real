# ==============================================================================
# SO-101 Robot Arm Configuration
# Actuators: Feetech STS3215 Smart Serial Bus Servos (6 DOF)
# ==============================================================================

robot:
  name: "so101"
  num_dof: 6
  base_mount_pos: [0.05, 0.0, 0.412]

  joints:
    - name: "shoulder_pan"
      index: 0
      min_rad: -1.91986
      max_rad: 1.91986
      max_torque_nm: 2.94
    - name: "shoulder_lift"
      index: 1
      min_rad: -1.74533
      max_rad: 1.74533
      max_torque_nm: 2.94
    - name: "elbow_flex"
      index: 2
      min_rad: -1.69000
      max_rad: 1.69000
      max_torque_nm: 2.94
    - name: "wrist_flex"
      index: 3
      min_rad: -1.65806
      max_rad: 1.65806
      max_torque_nm: 2.94
    - name: "wrist_roll"
      index: 4
      min_rad: -2.74385
      max_rad: 2.84121
      max_torque_nm: 2.94
    - name: "gripper"
      index: 5
      min_rad: -0.17453 # Fully closed / grasping
      max_rad: 1.74533  # Fully open
      max_torque_nm: 2.94

  actuator_dynamics:
    damping: 0.60
    frictionloss: 0.052
    armature: 0.028
    kp: 998.22
    kv: 2.731

  home_qpos: [0.0, 0.0, 1.20, -1.20, 0.0, 1.20]
