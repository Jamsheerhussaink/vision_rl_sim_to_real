# ==============================================================================
# Intel RealSense D415 RGB Camera Configuration (Sim-to-Real Alignment)
# Calibrated against /home/ai/jamshi/vision_rl/env final.png
# ==============================================================================

camera:
  name: "realsense_d415_rgb"
  model: "Intel RealSense D415"
  type: "eye_to_hand" # Static camera mounted on workspace tripod/extrusion

  # ----------------------------------------------------------------------------
  # Calibrated Mounting Measurements (Matching 'env final.png')
  # ----------------------------------------------------------------------------
  extrinsics:
    position: [0.12, -0.38, 0.82] # [X, Y, Z] in meters relative to table base
    lookat: [0.22, 0.10, 0.40]    # Table center lookat point
    xyaxes: [0.9701, -0.2425, 0.0000, 0.1130, 0.4518, 0.8849]

  # ----------------------------------------------------------------------------
  # RealSense D415 RGB Sensor Intrinsics
  # ----------------------------------------------------------------------------
  intrinsics:
    width: 1366
    height: 768
    aspect_ratio: "16:9"
    fovy_deg: 42.5              # RealSense D415 RGB vertical FOV
    fovx_deg: 69.4              # RealSense D415 RGB horizontal FOV
    clip_near: 0.15
    clip_far: 3.0

  # ----------------------------------------------------------------------------
  # URDF Reference
  # ----------------------------------------------------------------------------
  urdf_file: "models/urdf/realsense_d415.urdf"
