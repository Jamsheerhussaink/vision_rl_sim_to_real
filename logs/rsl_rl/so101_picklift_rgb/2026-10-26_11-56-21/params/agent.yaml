seed: 42
device: cuda:0
num_steps_per_env: 64
init_at_random_ep_len: true
max_iterations: 2000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  - image
  critic:
  - critic
clip_actions: 1.0
check_for_nan: true
save_interval: 50
experiment_name: so101_picklift_rgb
run_name: ''
logger: wandb
neptune_project: so101-pick-lift-v6
wandb_project: so101-pick-lift-v6
resume: false
load_run: .*
load_checkpoint: logs/rsl_rl/so101_picklift_rgb/2026-10-26_11-12-49/model_600.pt
class_name: OnPolicyRunner
actor:
  class_name: isaac_vision_rl.utils.rl_agent:InitialPoseCNN
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: isaac_vision_rl.utils.rl_agent:ExplorationGaussian
    init_std: 0.25
    std_type: log
    min_std: 0.1
    max_std: 0.28
  cnn_cfg:
    output_channels:
    - 32
    - 64
    - 64
    kernel_size:
    - 8
    - 4
    - 3
    stride:
    - 4
    - 2
    - 1
    dilation: 1
    padding: none
    norm: none
    activation: elu
    max_pool: false
    global_pool: none
    flatten: true
critic:
  class_name: MLPModel
  hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: isaac_vision_rl.utils.rl_agent:ExplorationPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.0003
  schedule: fixed
  gamma: 0.991659695068833
  lam: 0.9581562520238902
  entropy_coef: 0.01
  desired_kl: null
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
  target_std: 0.22
  entropy_adaptation_rate: 0.05
  entropy_coef_min: 0.001
  entropy_coef_max: 0.05
policy: {}
